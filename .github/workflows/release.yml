name: Build Cadara releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: win
            arch: x64
            artifact: win-x64
          - name: macOS
            os: macos-13
            target: mac
            arch: x64
            artifact: mac-x64
          - name: macOS Apple Silicon
            os: macos-14
            target: mac
            arch: arm64
            artifact: mac-arm64
    defaults:
      run:
        working-directory: cadara
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cadara/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      # The CAD runtime ships a standalone CPython instead of a CI-built
      # venv: venvs hardcode absolute interpreter paths (pyvenv.cfg home=,
      # bin symlinks, launcher exes), so a bundled venv breaks the moment
      # it lands on an end-user machine. Standalone distributions are
      # relocatable by design.
      - name: Download standalone Python runtime
        shell: bash
        run: |
          case "${{ matrix.artifact }}" in
            mac-arm64) TRIPLE="aarch64-apple-darwin" ;;
            mac-x64)   TRIPLE="x86_64-apple-darwin" ;;
            win-x64)   TRIPLE="x86_64-pc-windows-msvc-shared" ;;
          esac
          PBS_VERSION="20240107"
          curl -fL "https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_VERSION}/cpython-3.12+${TRIPLE}-install_only.tar.gz" -o python-dist.tar.gz
          mkdir -p cad-runtime/python-dist
          tar -xzf python-dist.tar.gz -C cad-runtime/python-dist --strip-components=1
          rm -f python-dist.tar.gz

      - name: Install CAD runtime dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY="cad-runtime/python-dist/python.exe"
          else
            PY="cad-runtime/python-dist/bin/python3"
          fi
          "$PY" --version
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --target cad-runtime/pylibs -r cad-runtime/requirements.txt

      - name: Build installer
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist -- --${{ matrix.target }} --${{ matrix.arch }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cadara-${{ matrix.artifact }}
          path: cadara/dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/**