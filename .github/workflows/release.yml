name: Build Cadara releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: win
            arch: x64
            artifact: win-x64
          - name: macOS
            # macos-13 (Intel) was retired Dec 2025 and jobs sit queued
            # forever; macos-15-intel is the supported x86_64 label.
            os: macos-15-intel
            target: mac
            arch: x64
            artifact: mac-x64
          - name: macOS Apple Silicon
            os: macos-14
            target: mac
            arch: arm64
            artifact: mac-arm64
    defaults:
      run:
        working-directory: cadara
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cadara/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      # The CAD runtime ships a standalone CPython instead of a CI-built
      # venv: venvs hardcode absolute interpreter paths (pyvenv.cfg home=,
      # bin symlinks, launcher exes), so a bundled venv breaks the moment
      # it lands on an end-user machine. Standalone distributions are
      # relocatable by design.
      - name: Download standalone Python runtime
        shell: bash
        env:
          # python-build-standalone release tag; bump freely — the exact
          # cpython-3.12 asset is resolved at run time from the release API,
          # so asset-name changes can't break the build.
          PBS_TAG: "20260814"
        run: |
          case "${{ matrix.artifact }}" in
            mac-arm64) TRIPLE="aarch64-apple-darwin" ;;
            mac-x64)   TRIPLE="x86_64-apple-darwin" ;;
            win-x64)   TRIPLE="x86_64-pc-windows-msvc" ;;
          esac
          ASSET_URL=""
          for attempt in 1 2 3 4 5; do
            ASSET_URL=$(curl -sfL --retry 5 --retry-delay 5 --retry-all-errors "https://api.github.com/repos/astral-sh/python-build-standalone/releases/tags/${PBS_TAG}" 2>/dev/null \
              | jq -r --arg tag "$PBS_TAG" --arg triple "$TRIPLE" \
                  '[.assets[] | select(.name | startswith("cpython-3.12") and endswith("+" + $tag + "-" + $triple + "-install_only.tar.gz"))][0].browser_download_url // empty' || true)
            if [ -n "$ASSET_URL" ]; then break; fi
            echo "Release API attempt $attempt failed; retrying"
            sleep 5
          done
          if [ -z "$ASSET_URL" ]; then
            echo "::error::No matching cpython-3.12 install_only asset for ${TRIPLE} in tag ${PBS_TAG}"
            exit 1
          fi
          echo "Downloading $ASSET_URL"
          # GitHub CDN connections occasionally reset mid-transfer
          # (curl exit 56): resume partial downloads, validate the
          # archive, and retry the whole thing a few times.
          DOWNLOAD_OK=0
          for attempt in 1 2 3 4 5; do
            if curl -fL --continue-at - --retry 5 --retry-delay 5 --retry-all-errors "$ASSET_URL" -o python-dist.tar.gz \
              && tar -tzf python-dist.tar.gz > /dev/null 2>&1; then
              DOWNLOAD_OK=1
              break
            fi
            echo "Download attempt $attempt failed or archive corrupt; retrying"
            rm -f python-dist.tar.gz
            sleep 5
          done
          if [ "$DOWNLOAD_OK" != "1" ]; then
            echo "::error::Failed to download a valid archive from $ASSET_URL"
            exit 1
          fi
          mkdir -p cad-runtime/python-dist
          tar -xzf python-dist.tar.gz -C cad-runtime/python-dist --strip-components=1
          rm -f python-dist.tar.gz

      - name: Install CAD runtime dependencies
        shell: bash
        # requirements.txt references the local cadpy package via a path
        # relative to cad-runtime/ (matches the README dev setup), so run
        # pip from inside cad-runtime/.
        working-directory: cadara/cad-runtime
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY="python-dist/python.exe"
          else
            PY="python-dist/bin/python3"
          fi
          "$PY" --version
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --target pylibs -r requirements.txt

      - name: Build installer
        # No CSC_*/APPLE_* env vars here on purpose: mapping an unset
        # secret produces an empty-string CSC_LINK, which electron-builder
        # treats as a relative cert path and dies with "<dir> not a file".
        # With identity="-" in package.json, it forces ad-hoc macOS signing
        # to prevent Gatekeeper "damaged" errors.
        run: npm run dist -- --${{ matrix.target }} --${{ matrix.arch }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cadara-${{ matrix.artifact }}
          # Only electron-builder's installers (artifactName is
          # Cadara-${version}-${os}-${arch}): dist/ also holds the
          # unpacked app bundle (Cadara.exe, bundled python.exe, pylibs)
          # whose files must never leak into artifacts. Blockmaps are
          # intentionally excluded to keep the release page clean.
          path: |
            cadara/dist/**/Cadara-*.exe
            cadara/dist/**/Cadara-*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install from your terminal

            **macOS**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/pulakit001/cadara-text-to-cad/main/install.sh | bash
            ```

            **Windows (PowerShell)**
            ```powershell
            irm https://raw.githubusercontent.com/pulakit001/cadara-text-to-cad/main/install.ps1 | iex
            ```

            This is the only supported installation method.
          files: release-files/**